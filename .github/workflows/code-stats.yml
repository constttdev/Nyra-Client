name: Weekly Code Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloc and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc jq

      - name: Generate statistics
        run: |
          cloc . \
            --json \
            --exclude-dir=.git,.github,.gradle,build,out,run,node_modules \
            > cloc.json

      - name: Build Discord payload
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TOTAL_FILES=$(jq '.SUM.nFiles' cloc.json)
          TOTAL_CODE=$(jq '.SUM.code' cloc.json)
          TOTAL_COMMENTS=$(jq '.SUM.comment' cloc.json)
          TOTAL_BLANK=$(jq '.SUM.blank' cloc.json)

          TOP_LANGS=$(
            jq -r '
              to_entries
              | map(select(.key != "header" and .key != "SUM"))
              | sort_by(.value.code)
              | reverse
              | .[:5]
              | map("• **\(.key)** — \(.value.code) LOC")
              | join("\n")
            ' cloc.json
          )

          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)

          cat > payload.json <<EOF
          {
            "embeds": [
              {
                "title": "📊 Weekly Development Report",
                "description": "**Nyra Client**",
                "color": 5814783,
                "thumbnail": {
                  "url": "https://github.com/${REPO%/*}.png"
                },
                "fields": [
                  {
                    "name": "💻 Lines of Code",
                    "value": "${TOTAL_CODE}",
                    "inline": true
                  },
                  {
                    "name": "📁 Files",
                    "value": "${TOTAL_FILES}",
                    "inline": true
                  },
                  {
                    "name": "💬 Comments",
                    "value": "${TOTAL_COMMENTS}",
                    "inline": true
                  },
                  {
                    "name": "⬜ Blank Lines",
                    "value": "${TOTAL_BLANK}",
                    "inline": true
                  },
                  {
                    "name": "📝 Latest Commit",
                    "value": "\`${COMMIT_HASH}\`\n${COMMIT_MSG}",
                    "inline": false
                  },
                  {
                    "name": "📚 Top Languages",
                    "value": "${TOP_LANGS}",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Generated by GitHub Actions"
                },
                "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              }
            ]
          }
          EOF

      - name: Send to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "$WEBHOOK"